# Enable JetStream persistence
jetstream {
  store_dir: "/data/jetstream"
  max_mem: 1G
  max_file: 10G
}

# Listen on all interfaces
listen: 0.0.0.0:4222

# HTTP monitoring endpoint
http: 8222

# Optional authentication (uncomment for restricted environments)
# authorization {
#   user: "admin"
#   password: "changeme"
# }